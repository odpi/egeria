// This HAS to be the first block of the file
pluginManagement {
    repositories {
        // releases
        mavenCentral()
        // snapshots
        maven { url = uri("https://central.sonatype.com/repository/maven-snapshots/") }
        // Once you start using pluginManagement, you should explicitly add this, unless
        // you NEVER want to use this repository
        gradlePluginPortal()
    }
    plugins {
        // Checks for unnecessary dependencies
        id("com.autonomousapps.dependency-analysis") version "3.19.1"
        // Declares capabilities for well-known JVM libraries so that Gradle can detect when two
        // artifacts provide the same classes - the jakarta/javax splits, and the competing SLF4J
        // implementations - and resolves those conflicts.  Version 2 of this plugin replaced both
        // 'org.gradlex.java-ecosystem-capabilities' and 'dev.jacomet.logging-capabilities', which are
        // discontinued; the logging DSL now lives under jvmDependencyConflicts.logging.
        id 'org.gradlex.jvm-dependency-conflict-resolution' version "2.5"
        // Docs don't recommend specifying a version for checkstyle
        id 'checkstyle'
        // This plugin needs to be kept in step with bom
        id 'org.springframework.boot' version '3.5.16'
        id 'com.gradleup.shadow' version '9.6.1'
    }
}
