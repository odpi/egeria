---
name: "Verify PR v6"

on:
  pull_request:
    branches: [main, egeria-release-6*]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Verify PR v6"
    if: startsWith(github.repository,'odpi/')
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      # setup-gradle validates the Gradle wrapper checksums itself - validate-wrappers
      # defaults to true - which is why there is no separate wrapper-validation step.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          # Only cache for main build
          cache-read-only: true
      - name: Build with Gradle
        run: ./gradlew build --scan
      - name: Upload Test coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Jacoco Coverage Report
          path: build/reports/jacoco/codeCoverageReport
      - name: Upload Log of any dependency failures
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Dependency Analysis Report (on failure)
          path: build/reports/dependency-analysis/build-health-report.txt
          if-no-files-found: ignore
