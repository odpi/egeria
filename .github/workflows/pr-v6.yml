---
name: "Verify PR v6"

on:
  pull_request:
    branches: [main, egeria-release-6*]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Verify PR v6"
    if: startsWith(github.repository,'odpi/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # tag=v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      # setup-gradle validates the Gradle wrapper checksums itself - validate-wrappers
      # defaults to true - which is why there is no separate wrapper-validation step.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # tag=v6.4.0
        with:
          # Only cache for main build
          cache-read-only: true
      - name: Build with Gradle
        run: ./gradlew build --scan
      - name: Upload Test coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
        with:
          name: Jacoco Coverage Report
          path: build/reports/jacoco/codeCoverageReport
      - name: Upload Log of any dependency failures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
        with:
          name: Dependency Analysis Report (on failure)
          path: build/reports/dependency-analysis/build-health-report.txt
          if-no-files-found: ignore
