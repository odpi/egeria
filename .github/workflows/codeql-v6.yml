# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
---
name: "CodeQL Analysis v6"

on:
  push:
    branches: [main, egeria-release-6*]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main, egeria-release-6*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ github.repository == 'odpi/egeria'}}
    name: "CodeQL Build v6"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Setup Java JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # tag=v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # tag=v4.37.9
        with:
          languages: java
          queries: security-and-quality
          ram: 4096
      # setup-gradle validates the Gradle wrapper checksums itself - validate-wrappers
      # defaults to true - which is why there is no separate wrapper-validation step.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # tag=v6.3.0
        with:
          # codeQL requires a full before/after build to compare results. Caching can result in action failing
          cache-disabled: true
      - name: Build
        run: ./gradlew -x javadoc -x test build -PskipOpenTypesFVT
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # tag=v4.37.9
        with:
          ram: 4096
