---
name: Mark stale issues and pull requests

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  stale:
    permissions:
      issues: write  # for actions/stale to close stale issues
      pull-requests: write  # for actions/stale to close stale PRs
    runs-on: ubuntu-latest
    if: startsWith(github.repository,'odpi/')
    steps:
      - name: check stale issues and prs
        if: startsWith(github.repository,'odpi/')
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # tag=v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            not had recent activity. It will be closed in 20 days if no
            further activity occurs. Thank you for your contributions.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not
            had recent activity. It will be closed in 20 days if no further
            activity occurs. Thank you for your contributions.
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
          days-before-stale: 60
          days-before-close: 20
          exempt-issue-labels: 'pinned'
          # 'dependencies' is the label dependabot puts on its own pull requests.  Without this exemption
          # the stale bot closes them, and closing a dependabot PR tells dependabot not to offer that
          # version again - so the dependency silently freezes.  That is how actions/upload-artifact sat
          # at 4.4.0 for a year: dependabot offered 5.0.0, 6.0.0 and 7.0.0, each superseded by the next
          # harmlessly, and then closed #9048 (7.0.1) after 82 days with nothing left to supersede it.
          exempt-pr-labels: 'pinned,dependencies'
          operations-per-run: 30
