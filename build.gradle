/*
 * Plugins for this parent module only - so just high level project related
 * Plugin management - ie version specs - are in settings.gradle
 */
plugins {
    id "io.freefair.aggregate-javadoc"
    // Checks for unnecessary dependencies
    id 'com.autonomousapps.dependency-analysis'
    // helps resolve log implementation clashes and the jakarta/javax capability splits
    id 'org.gradlex.jvm-dependency-conflict-resolution'
    id 'checkstyle'
}

/*
 * See pom/build.gradle for the Egeria BOM - including specification of dependency constraints and versions
 * This has MOVED from this top level project
 */

/*
 * Modules whose javadoc is complete enough to hold the line.  For these, doclint's "missing" group is
 * switched on and its findings fail the build, so a parameter cannot be added without documenting it.
 *
 * Everywhere else keeps the previous behaviour - doclint runs, but the "missing" group is disabled -
 * because turning it on across the whole repository at once would fail on documentation debt that
 * predates the check.  The intent is to clear that debt a module at a time and move each module into
 * this list as it is cleared, rather than leave the check switched off everywhere for ever.
 */
ext.javadocStrictModules = [
        // Empty for now.  The mechanism below is wired and proven, but no module is clean enough to hold
        // the line yet: doclint's "missing" group also requires a comment on every member it can see, and
        // repository-services-apis - the nearest candidate, and the one whose @param tags have been filled
        // in - still reports 95 "no comment" warnings, mostly on private fields.  Clear a module's warnings,
        // then add it here, and the check will keep it clear.
]

/*
 * Configuration for all projects - INCLUDING this one
 */
allprojects {
    group = 'org.odpi.egeria'
    version = '6.2-SNAPSHOT'

    // Signing/publish used in parent & child projects
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    // Only use maven central
    repositories {
        mavenCentral()
    }
} // end of allProjects

/*
 * Configuration for sub projects only
 */
subprojects {
    // TODO: Consider using convention plugins to stylise different profiles of subprojects

    // The 'bom' project is a special case - we must not apply anything else to it
    if (project.name != 'bom' && project.buildFile.exists()) {
        apply plugin: 'java'
        apply plugin: 'jacoco'
        apply plugin: 'checkstyle'
        apply plugin: 'com.autonomousapps.dependency-analysis'
        apply plugin: 'org.gradlex.jvm-dependency-conflict-resolution'

        jvmDependencyConflicts {
            conflictResolution {
                // Tomcat's embedded core bundles the Jakarta Servlet API classes, so it conflicts with the
                // standalone jakarta.servlet-api jar that Spring Boot also puts on the classpath.  The
                // plugin's default strategy for this capability is "highest version", and it maps
                // tomcat-embed-core 10.1.x to servlet API 6.0 - so the standalone 6.1.0 jar wins and
                // tomcat-embed-core is evicted.  That silently removes the servlet container the platform
                // runs on: the build still succeeds and the packaged jar still starts, but it has no web
                // server.  Tomcat has to win this one.
                select(org.gradlex.jvm.dependency.conflict.detection.rules.CapabilityDefinition.JAKARTA_SERVLET_API,
                       'org.apache.tomcat.embed:tomcat-embed-core')
            }
        }

        // Checking of javaheaders for license & copyright.  This has to stay inside the guard above:
        // it configures the extension added by the checkstyle plugin, and outside the guard it would be
        // resolved from the root project instead - which Gradle 9 deprecates and Gradle 10 rejects.
        checkstyle {
            toolVersion = '10.7.0'
            showViolations = true
        }

        // Consistent dependencies, and exceptions
        dependencies {
            implementation platform(project(":bom"))
            // Some nasty clashes we want to avoid (consumers will need to make their own arrangements
            modules {
                module('org.glassfish:jakarta.json') {
                    replacedBy 'jakarta.json:jakarta.json-api', 'use jakarta.json.api instead of glassfish'
                }
            }
        }

        // we already have bridge modules that implement commons logging, so cannot have another implementation in classpath
        // we also want to avoid the glassfish implementation of jakarta.json (if we have to, will replace as above)
        configurations {
            all {
                exclude module: 'commons-logging'
                exclude module: 'org.glassfish:jakarta.json'
                resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
            }
        }

        // Maven publishing (to public repo) requires we included source and javadoc jars
        java {
            // Compile, test and javadoc with a JDK 21 toolchain that Gradle locates itself, rather than
            // whatever JDK happens to be on JAVA_HOME.  Without this, building with an older JDK fails
            // deep in javac with "release version 21 not supported"; with it, Gradle either finds an
            // installed 21 or reports that no matching toolchain is available.
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }

            withSourcesJar()
            withJavadocJar()
        }

        // JavaExec tasks - the archive writers, report generators and the application plugin's own 'run'
        // task - do not pick up the toolchain from the java extension the way JavaCompile, Test and
        // Javadoc do, so they have to be pointed at it explicitly.  Without this they run on whatever
        // JAVA_HOME provides and fail with UnsupportedClassVersionError on class files built for 21.
        tasks.withType(JavaExec).configureEach {
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        // compile flags
        tasks.withType(JavaCompile) {
            options.release = 21
            options.encoding = 'UTF-8'
            options.incremental = true
            options.failOnError = true
            options.compilerArgs << "-Xlint:all" << "-Xmaxerrs" << "1000" << "-Xmaxwarns" << "1000"
            // Retain method parameter names in the bytecode.  Spring needs them to bind REST request
            // parameters; without this it falls back to LocalVariableTableParameterNameDiscoverer, which
            // is deprecated for removal in Spring Framework 6.1.
            options.compilerArgs << "-parameters"
        }

        tasks.withType(Javadoc).configureEach {
            if (project.path in rootProject.javadocStrictModules) {
                // Full doclint, including the "missing" group that catches an undocumented parameter,
                // return value or exception.  -Werror turns those findings into a build failure rather
                // than a warning scrolling past in the log, which is the only way they stay fixed.
                options.addStringOption('Xdoclint:all', '-quiet')
                options.addBooleanOption('Werror', true)
            }
            else {
                options.addStringOption('Xdoclint:-missing', '-quiet')
            }
        }

        // javadoc
        javadoc {
            options
            {
                addBooleanOption('html5', true)
                setMemberLevel JavadocMemberLevel.PUBLIC
            }
        }

        publishing {
            {
                publications {
                    mavenmodule(MavenPublication) {
                        from components.java
                        pom {
                            url = 'https://egeria.odpi.org'
                            licenses {
                                // Code
                                license {
                                    name = 'The Apache License, Version 2.0'
                                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                                }
                                // Docs
                                license {
                                    name = 'Creative Commons Attribution 4.0 International (CC BY 4.0)'
                                    url = 'https://creativecommons.org/licenses/by/4.0'
                                }
                            }
                            developers {
                                developer {
                                    id = 'mandy-chessell'
                                    name = 'Mandy Chessell'
                                    email = 'mandy.chessell@pdr-associates.com'
                                    timezone = 'Europe/London'
                                    roles = ['Project Leader']
                                    organization = 'Pragmatic Data Research Ltd'
                                }
                                developer {
                                    id = 'planetf1'
                                    name = 'Nigel Jones'
                                    email = 'nigel.l.jones+git@gmail.com'
                                    roles = ['maintainer']
                                    organization = 'IBM Corporation'
                                }
                                developer {
                                    id = 'dwolfson'
                                    name = 'Dan Wolfson'
                                    email = 'dan.wolfson@pdr-associates.com'
                                    roles = ['maintainer']
                                    organization = 'Pragmatic Data Research Ltd'
                                }
                            }
                            scm {
                                connection = 'scm:git:git://github.com/odpi/egeria.git'
                                developerConnection = 'scm:git:ssh://github.com/odpi/egeria/egeria.git'
                                url = 'https://github.com/odpi/egeria'
                            }
                            organization {
                                name = 'LF AI & Data Foundation'
                                url = 'https://lfaidata.foundation'
                            }
                            issueManagement {
                                system = 'GitHub'
                                url = 'https://github.com/odpi/egeria/issues'
                            }
                            inceptionYear = '2018'
                            mailingLists {
                                mailingList {
                                    name = 'Egeria mailing list'
                                    subscribe = 'egeria-technical-discuss+subscribe@lists.lfaidata.foundation'
                                    unsubscribe = 'egeria-technical-discuss+unsubscribe@lists.lfaidata.foundation'
                                    post = 'egeria-technical-discuss@lists.lfaidata.foundation'
                                    archive = 'https://lists.lfaidata.foundation/g/egeria-technical-discuss/topics'
                                }
                            }
                        }
                        // Override the project name & description for the pom based on properties set in the child build.gradle (hard to default & required for maven central)
                        //
                        // Both values are captured during configuration rather than read inside withXml,
                        // which is applied while the task runs - reaching for `project` then is
                        // unsupported with the configuration cache and leaves a zero-length pom.  That is
                        // easy to miss, because POM generation is not part of `build`.
                        //
                        // The description has to be taken in afterEvaluate: this block is configured from
                        // the root project's subprojects {} closure, which runs before each module's own
                        // build.gradle has set its description.
                        def pomName = project.name
                        def pomDescription = null

                        project.afterEvaluate {
                            pomDescription = project.description
                        }

                        pom.withXml {
                            asNode().appendNode('name', pomName)
                            asNode().appendNode('description', pomDescription)
                        }
                    }
                }
            }

        }
        if (System.getenv("CI")) {
            apply plugin: 'signing'
            signing {
                // gpg --export-secret-keys myemal@gmail.com | base64
                def signingKey = System.getenv('OSSRH_GPG_PRIVATE_KEY')
                // Passphrase for key
                def signingPassword = System.getenv('OSSRH_GPG_PASSPHRASE')
                // public key id (last 8 characters only) - note keys also need uploading to all the main registries
                def signingKeyId = System.getenv('OSSRH_GPG_KEYID')
                // We use these values from secrets rather than gradle.properties
                useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
                sign publishing.publications.mavenmodule
            }
        }
    }

    // Always need these repos
    publishing {

        // Release versions get pushed to staging area on maven central, snapshots to snapshot repo
        // Secrets for credentials
        repositories {
            maven {
                name = mavenRepoName
                url = version.toString().endsWith('SNAPSHOT') ? mavenSnapshotRepoUrl : mavenRepoUrl
                // User token generated at https://central.sonatype.com/usertoken
                credentials {
                    username = mavenRepoUser
                    password = mavenRepoPass
                }
            }
        }
    }

    // shorthand for checking dependencies
    task printAllDependencies(type: DependencyReportTask) {}
    task printSubDependencies(type: DependencyReportTask) {}
    task findDependency(type: DependencyInsightReportTask) {}
}


