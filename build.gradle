// Jacoco reporting -- from gradle docs
task codeCoverageReport(type: JacocoReport) {
    // Gather execution data from all subprojects
    executionData fileTree(project.rootDir.absolutePath).include("**/build/jacoco/*.exec")
    // Add all relevant sourcesets from the subprojects
    subprojects.each {
        // Only projects that actually apply the java plugin have a sourceSets container of their own.
        // Asking the others for one used to fall through to their parent project, which Gradle 9
        // deprecates and Gradle 10 rejects - and they have no source to report on in any case.
        if (it.plugins.hasPlugin('java')) {
            sourceSets it.sourceSets.main
        }
    }
    // enable the different report types (html, xml, csv)
    reports {
        // xml is usually used to integrate code coverage with
        // other tools like SonarQube, Coveralls or Codecov
        xml.required = true

        // HTML reports can be used to see code coverage
        // without any external tools
        html.required = true
        csv.required = true
    }
}
// always run the tests before generating the report
codeCoverageReport.dependsOn {
    subprojects*.test
}

// Dependency checking - see https://github.com/autonomousapps/dependency-analysis-android-gradle-plugin
dependencyAnalysis {
    issues {
        all {
            onAny {
                severity('fail')
            }
        }

        // Spring Boot starters are POM-only aggregators: they contribute no classes of their own, so
        // dependency-analysis always reports them as unused.  They are exactly what the platform chassis
        // is meant to declare - removing them would strip the runtime stack out of the server - so the
        // advice is suppressed here rather than acted on.
        project(':open-metadata-implementation:platform-chassis:platform-chassis-spring') {
            onUnusedDependencies {
                exclude('org.springframework.boot:spring-boot-starter-actuator',
                        'org.springframework.boot:spring-boot-starter-tomcat',
                        'org.springframework.boot:spring-boot-starter-validation',
                        'org.springframework.boot:spring-boot-starter-web',
                        'org.springframework.boot:spring-boot-starter-test')
            }
        }
    }
}

// Always run dependency check for every regular build
build.dependsOn("buildHealth")

/*
 * `build` is not everything CI runs.  The merge and release workflows also generate the publication POMs,
 * assemble the distribution and build the aggregate javadoc site, and none of those is reachable from
 * `build` - so a green local build has repeatedly hidden breakage in them.  Three times during the 6.2
 * toolchain work: the packaged jar's launcher, POM generation producing zero-length files, and the
 * aggregate javadoc.
 *
 * `./gradlew verifyRelease` runs the parts that can share one invocation, and names the one that cannot.
 */
tasks.register('verifyRelease') {
    group = 'verification'
    description = 'Runs what CI runs: every module build and test, the publication POMs and the platform distribution.'

    // Container projects - the ones that only group other modules - have no build file, so they have
    // neither a build to run nor a publication to generate a POM for.
    def realSubprojects = subprojects.findAll { it.buildFile.exists() }

    // Every module's own build, not just the root's.  `dependsOn 'build'` alone resolves to the root
    // project's build task, and the root has no source - so it runs nothing and every module's tests are
    // skipped.  Naming the subproject task paths is what actually compiles and tests the code.
    dependsOn 'build'
    dependsOn realSubprojects.collect { "${it.path}:build" }
    dependsOn realSubprojects.collect { "${it.path}:generatePomFileForMavenmodulePublication" }
    dependsOn ':open-metadata-distribution:omag-server-platform:assemble'

    doLast {
        logger.lifecycle('')
        logger.lifecycle('verifyRelease: every module build and test, every publication POM, and the platform distribution are green.')
        logger.lifecycle('')
        logger.lifecycle('One thing cannot share this invocation - the aggregate-javadoc plugin is not')
        logger.lifecycle('compatible with the configuration cache (see the note in settings.gradle).')
        logger.lifecycle('Run it separately before a release:')
        logger.lifecycle('')
        logger.lifecycle('    ./gradlew aggregateJavadoc --no-configuration-cache')
        logger.lifecycle('')
    }
}
