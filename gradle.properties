# Allow parallel builds (defaults will be 1 per CPU thread)
org.gradle.parallel=true

# Caching
org.gradle.caching=true

# Watch filesystem for changes. Disable if memory constrained
org.gradle.vfs.watch=true

# Default logging output
org.gradle.console=auto

# Report deprecated feature usage.  This is deliberately 'all' rather than 'fail' only while the
# Spring Boot Gradle plugin is on 3.1.4: its BootZipCopyAction calls FileTreeElement.getMode(), which
# Gradle 8.14 deprecates and Gradle 9 removes.  Egeria's own build scripts are clean - restore 'fail'
# once Spring Boot is upgraded (stage 4 of the 6.2 toolchain work).
org.gradle.warning.mode=all

# Defer configuration until needed
org.gradle.configureondemand=true

# Increase memory to 4GB
org.gradle.jvmargs=-Xmx4096m

# If system is quiet, all cpu will be used anyway. But on interactive desktop this will
# help keep system responsive whilst a build is running
org.gradle.priority=low

# Timeout the daemon after an hour
org.gradle.daemon.idletimeout=3600000

# Maven publish repository name
mavenRepoName=OSSRH

# Maven publish repository url for release versions
#   Staging area on Maven Central - artifacts are transferred to the Central Portal by the release workflow
#   it can be overridden by env variable ORG_GRADLE_PROJECT_mavenRepoUrl
mavenRepoUrl=https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/

# Maven publish repository url for SNAPSHOT versions
#   Snapshots are not staged or validated - they go straight to the Central Portal snapshot repo
#   it can be overridden by env variable ORG_GRADLE_PROJECT_mavenSnapshotRepoUrl
mavenSnapshotRepoUrl=https://central.sonatype.com/repository/maven-snapshots/

# Maven publish repository user
#   it can be overridden by env variable ORG_GRADLE_PROJECT_mavenRepoUser
mavenRepoUser=
# Maven publish repository password
#   it can be overridden by env variable ORG_GRADLE_PROJECT_mavenRepoPass
mavenRepoPass=