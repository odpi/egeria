apiVersion: v1.0.0
kind: DataProduct
id: 4f0b9a5e-2c31-4b6a-9d7e-1a2b3c4d5e6f
name: Teddy Bear Drop Foot Weekly Measurements
version: 1.0.0
status: active
domain: clinical-trials
tenant: CocoPharmaceuticals
description:
  purpose: Gather the weekly drop foot angle measurements from the hospitals taking part in the Teddy Bear Drop Foot clinical trial (PROJ-CT-TBDF), validate them, and provide them to the research team.
  limitations: Only the hospitals certified for the clinical trial may supply measurements.  The data is pseudonymized - patients are identified only by their trial patient identifier.
  usage: Used by the clinical trial research team to assess the effectiveness of the treatment.  Not for use outside the clinical trial without approval from the clinical trial sponsor.
