plugins {
    id 'application'
    id "com.gradleup.shadow"
}

dependencies {
    implementation project(':open-metadata-implementation:repository-services:repository-services-apis')
    implementation project(':open-metadata-implementation:repository-services:repository-services-archive-utilities')
    implementation project(':open-metadata-resources:open-metadata-archives:open-metadata-types')
    implementation project(':open-metadata-resources:open-metadata-archives:content-pack-helpers')
    implementation project(':open-metadata-resources:open-metadata-archives:open-metadata-types')
    implementation project(':open-metadata-implementation:frameworks:open-metadata-framework')
    runtimeOnly project(':open-metadata-implementation:adapters:open-connectors')
    runtimeOnly project(':open-metadata-implementation:adapters:open-connectors:repository-services-connectors:open-metadata-archive-connectors:open-metadata-archive-file-connector')
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations'
    runtimeOnly 'ch.qos.logback:logback-classic'

}

description = 'Simple Catalogs'

java {
    withJavadocJar()
}

test {
    useTestNG()
    // This will default to standard search pattern - see https://docs.gradle.org/current/userguide/java_testing.html#sec:test_detection
    scanForTestClasses = false
}

application {
    mainClass = 'org.odpi.openmetadata.archiveutilities.simplecatalogs.SimpleCatalogsArchiveWriter'
}

shadowJar {
    archiveClassifier = 'jar-with-dependencies'
}

/*
 * The archive writers resolve their GUID map - and write their archives - relative to the working directory, and
 * the maps that keep element identities stable from one build to the next live at the top of the repository.
 * Gradle would otherwise run the writer in this module's directory, where it finds no map (or a stale one) and
 * quietly allocates fresh GUIDs for content that has already shipped, while reporting that nothing changed.
 */
run {
    workingDir = rootProject.projectDir
}

