# ========================================================================================================
# This is unity-catalog-fvt's own application.properties, used to configure the in-process OMAG Server
# Platform that OMAGPlatformExtension starts for this suite.  It is deliberately separate from the repo-root
# application.properties so that the Unity Catalog servers this suite targets, the PostgreSQL server its
# repository lives on, and the Kafka broker carrying the access services' out topics can all be changed here
# without touching Java code.
#
# This suite runs *four* servers on the one platform - a metadata access store, an integration daemon, an
# engine host and a view server - so that the Unity Catalog connectors can be driven the way they are
# deployed rather than called directly.  Two reachable Unity Catalog servers and a PostgreSQL server are
# always required; a Kafka broker is required only for the default run - see unitycatalog.fvt.event.bus.
#
# All paths below are resolved relative to this module's project directory
# (open-metadata-test/open-metadata-fvt/unity-catalog-fvt), which is Gradle's default working directory for
# the "test" task.

###############################################
### The platform's HTTP port is NOT set here.  OMAGPlatformExtension allocates a free port at runtime and
### passes it in, so that two checkouts of Egeria - or two suites - can run their tests at the same time
### without colliding.  Anything below that needs the port refers to it as ${server.port}.
###############################################
platform.name=unity-catalog-fvt OMAG Server Platform
platform.description=Hermetic, in-process platform started by the unity-catalog-fvt functional verification test suite.
platform.organization.name=Egeria unity-catalog-fvt

###############################################
### Configuration document store - kept under this module's build directory so repeated runs start from a
### clean config each time.  The repository content is emptied at start-up instead - see
### UnityCatalogFvtTestSupport.emptyRepository.
################################################
platform.configstore.provider=org.odpi.openmetadata.adapters.adminservices.configurationstore.file.FileBasedServerConfigStoreProvider
platform.configstore.endpoint=build/unity-catalog-fvt-data/servers/{0}/config/{0}.config

################################################
### Placeholder variables substituted into configuration document field values (syntax: ~{name}~) each time
### a server is (re)started.
###
### "repositoryDatabaseURL" is the JDBC URL of the PostgreSQL server that backs the metadata access store's
### local repository.  The default targets the "egeria-shared-postgres" docker container used elsewhere in
### this project for local testing.
###
### "kafkaEndpoint" must be the broker's EXTERNAL advertised listener (oak.local:9194), not the internal one:
### this suite runs on the host rather than inside the docker network.
################################################
platform.placeholder.variables=\
  {\
    "organizationName" : "Egeria unity-catalog-fvt",\
    "egeriaEndpoint" : "http://localhost:${server.port}",\
    "repositoryDatabaseURL" : "jdbc:postgresql://localhost:5442/egeria",\
    "egeriaServersSecretsStore" : "../../../open-metadata-resources/open-metadata-deployment/secrets/egeria-servers.omsecrets",\
    "repositorySecretCollectionName" : "PostgreSQLRepository",\
    "kafkaEndpoint" : "oak.local:9194"\
  }

################################################
### Servers are configured and started by OMAGPlatformExtension, not at platform start-up.
################################################
startup.user=system
startup.server.list=

################################################
### No user authentication - UnityCatalogFvtSecurityConfig supplies a permit-all filter chain instead.
################################################
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
spring.main.allow-bean-definition-overriding=true
authn.header.name.list=
cors.allowed-origins=*

app.description=unity-catalog-fvt - Unity Catalog connectors functional verification tests
app.title=Egeria unity-catalog-fvt
scan.packages=org.odpi.openmetadata.*
springdoc.api-docs.enabled=false
management.health.cassandra.enabled=false
management.health.redis.enabled=false
management.health.ldap.enabled=false

################################################
### Event bus.  "kafka" (the default) publishes the access services' out topics to the broker named by
### kafkaEndpoint above; "none" configures them without topics, which -PrunUnityCatalogFvtNoKafka selects.
################################################
unitycatalog.fvt.event.bus=kafka

################################################
### The Unity Catalog servers under test.
###
### The *read-only* server is catalogued, synchronized into open metadata and surveyed, but nothing is ever
### written to it - it may be in use by something else.  The suite expects it to hold the standard Unity
### Catalog sample: catalog "unity", schema "default", with tables, volumes and functions.
###
### The *writable* server is where the suite creates - and deletes again - a catalog of its own, so that it
### can change Unity Catalog underneath the synchronizer and check that open metadata follows.  Only a
### catalog whose name starts with unitycatalog.fvt.catalog.prefix is ever created or deleted there.
################################################
unitycatalog.fvt.readonly.host.url=http://localhost
unitycatalog.fvt.readonly.port=8087
unitycatalog.fvt.writable.host.url=http://localhost
unitycatalog.fvt.writable.port=8187
unitycatalog.fvt.sample.catalog=unity
unitycatalog.fvt.sample.schema=default
unitycatalog.fvt.catalog.prefix=egeria_ucfvt

################################################
### The PostgreSQL schema behind the metadata access store, and the credentials used to empty it.
################################################
unitycatalog.fvt.repository.secrets.store=../../../open-metadata-resources/open-metadata-deployment/secrets/egeria-servers.omsecrets
unitycatalog.fvt.repository.secrets.collection=PostgreSQLRepository
unitycatalog.fvt.repository.database.url=jdbc:postgresql://localhost:5442/egeria

################################################
### How long the suite waits.
################################################
unitycatalog.fvt.engine.action.timeout.seconds=300
unitycatalog.fvt.engine.action.poll.seconds=2
unitycatalog.fvt.refresh.timeout.seconds=180
unitycatalog.fvt.refresh.poll.seconds=2
unitycatalog.fvt.governance.server.timeout.seconds=180
unitycatalog.fvt.governance.server.poll.seconds=2

################################################
### Set to false to keep the previous run's repository content in place for inspection.
################################################
unitycatalog.fvt.clear.down=true

################################################
### Logging.  The audit log goes to build/unity-catalog-fvt-data/logs/audit.log - see logback-test.xml.
################################################
logging.level.root=WARN
logging.level.org.springframework=ERROR
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.odpi.openmetadata=WARN
logging.level.org.odpi.openmetadata.platformchassis.springboot=INFO
# Uncomment to log what the Unity Catalog connectors are doing:
#logging.level.org.odpi.openmetadata.adapters.connectors.unitycatalog=DEBUG
