# ========================================================================================================
# This is type-fvt's own application.properties, used to configure the in-process OMAG Server Platform
# that OMAGPlatformExtension starts for this suite.  It is deliberately separate from the repo-root
# application.properties (and from open-metadata-bvt, which has none at all - it hardcodes an in-memory,
# no-external-dependency configuration in Java) so that the port this suite listens on, and which
# PostgreSQL server its repository stores metadata in, can both be changed here without touching any
# Java code.  The values below started out as copies of the repo-root application.properties, adjusted
# for this suite: a distinct port, no HTTPS/keystore (this platform is hermetic and in-process, like
# open-metadata-bvt's), and a "repositoryDatabaseURL" pointed at the PostgreSQL server actually reachable
# in this environment.
#
# All paths below are resolved relative to this module's project directory
# (open-metadata-test/open-metadata-fvt/type-fvt), which is Gradle's default working directory for the
# "test" task.

###############################################
### Port for this suite's OMAG Server Platform.  Change this if it clashes with something else on your
### machine (e.g. a real dev platform already running on 7443, or query-fvt on 9446).
################################################
server.port=9447

###############################################
### Set up the name and description for this platform.
################################################
platform.name=type-fvt OMAG Server Platform
platform.description=Hermetic, in-process platform started by the type-fvt functional verification test suite.
platform.organization.name=Egeria type-fvt

###############################################
### Configuration document store - kept under this module's build directory so repeated runs start from
### a clean config each time (the underlying PostgreSQL repository content, however, persists across
### runs - see TypeFvtTestSupport for the leftover-element cleanup that handles that).
################################################
platform.configstore.provider=org.odpi.openmetadata.adapters.adminservices.configurationstore.file.FileBasedServerConfigStoreProvider
platform.configstore.endpoint=build/type-fvt-data/servers/{0}/config/{0}.config

################################################
### Placeholder variables substituted into configuration document field values (syntax: ~{name}~) each
### time a server is (re)started.  Edit these to point at a different PostgreSQL server/database/schema
### or a different secrets file, without changing any Java code.
###
### "repositoryDatabaseURL" is the JDBC URL (no schema/query-string suffix - the test suite appends
### "?currentSchema=..." itself) of the PostgreSQL server that backs the metadata access store's local
### repository.  The default below targets the "egeria-shared-postgres" docker container used elsewhere
### in this project for local testing (see the "local-test-database-infrastructure" notes), which already
### has an "egeria" database and an "egeria_user" role provisioned.
###
### "repositorySecretCollectionName" must name a collection inside "egeriaServersSecretsStore" that
### supplies a userId/clearPassword (or password) able to connect to, and create schemas/tables within,
### that database - see open-metadata-resources/open-metadata-deployment/secrets/egeria-servers.omsecrets'
### "PostgreSQLRepository" collection, which is the default referenced here.
################################################
platform.placeholder.variables=\
  {\
    "organizationName" : "Egeria type-fvt",\
    "egeriaEndpoint" : "http://localhost:9447",\
    "repositoryDatabaseURL" : "jdbc:postgresql://localhost:5442/egeria",\
    "egeriaServersSecretsStore" : "../../../open-metadata-resources/open-metadata-deployment/secrets/egeria-servers.omsecrets",\
    "repositorySecretCollectionName" : "PostgreSQLRepository"\
  }

################################################
### This suite starts its one metadata access store server explicitly from Java (see
### OMAGPlatformExtension), so the platform itself should not try to auto-start anything on boot.
################################################
startup.user=system
startup.server.list=

################################################
### Security - this platform has no real user directory configured (it is a hermetic, in-process test
### platform, like open-metadata-bvt's), so Spring Boot's default security auto-configuration is switched
### off and a permit-all filter chain is supplied instead by TypeFvtSecurityConfig, which is picked up
### automatically via component scanning (scan.packages, below).  No HTTPS/keystore is configured either -
### the platform listens on plain HTTP.
################################################
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
authn.header.name.list=
cors.allowed-origins=*

################################################
# landing page (/api/public/app/info)
################################################
app.description=type-fvt - open metadata type functional verification tests
app.title=Egeria type-fvt

################################################
### Which java packages should be scanned to locate the Spring resource definitions that define the REST
### APIs (and, in this suite, the permit-all TypeFvtSecurityConfig bean)?
################################################
scan.packages=org.odpi.openmetadata.*

################################################
### Swagger Docs - not needed for a test suite.
################################################
springdoc.api-docs.enabled=false

################################################
### Spring Boot Actuator health checks - none of these backing services are configured.
################################################
management.health.cassandra.enabled=false
management.health.redis.enabled=false
management.health.ldap.enabled=false

################################################
### Logging.  Turn these up if you need to see what a query actually did.
################################################
logging.level.root=WARN
logging.level.org.springframework=ERROR
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.odpi.openmetadata=WARN
logging.level.org.odpi.openmetadata.platformchassis.springboot=INFO
# This suite deliberately attempts operations that are expected to be rejected (for example creating an
# instance of a type the repository will not accept directly) - keep the resulting, expected, server-side
# FFDC logging out of the build output.
logging.level.org.odpi.openmetadata.commonservices.ffdc.RESTExceptionHandler=OFF
# Uncomment to log every SQL statement the postgres repository connector issues:
#logging.level.org.odpi.openmetadata.adapters.connectors.resource.jdbc=DEBUG
# Uncomment to log how each repository API call is translated into a SQL query:
#logging.level.org.odpi.openmetadata.adapters.repositoryservices.postgres.repositoryconnector.database=DEBUG
# Uncomment to log every REST call this suite makes into the platform:
#logging.level.org.odpi.openmetadata.commonservices.ffdc.RESTCallLogger=DEBUG
