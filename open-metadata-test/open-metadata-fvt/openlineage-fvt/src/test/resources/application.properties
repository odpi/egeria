#
# Configuration for the in-process OMAG Server Platform started by the openlineage-fvt suite, and the suite's own
# settings (the openlineage.fvt.* keys).  Any of these can be overridden on the command line with -D, for example:
#
#   ./gradlew :open-metadata-test:open-metadata-fvt:openlineage-fvt:test -PrunOpenLineageFvt -Dopenlineage.fvt.kafka.endpoint=localhost:9092

platform.name=openlineage-fvt OMAG Server Platform
platform.description=Hermetic, in-process platform started by the openlineage-fvt functional verification test suite.
platform.organization.name=Egeria openlineage-fvt

platform.configstore.provider=org.odpi.openmetadata.adapters.adminservices.configurationstore.file.FileBasedServerConfigStoreProvider
platform.configstore.endpoint=build/openlineage-fvt-data/servers/{0}/config/{0}.config

# The ~{...}~ placeholders used in the server configurations are resolved from these variables.
#
# Kafka is reached on the shared container's external advertised listener (oak.local:9194) because the tests run
# on the host, outside the docker network - the internal listener (egeria-shared-kafka:9192) is not reachable from
# here.  The same endpoint is used for the servers' event bus and for the topic the Kafka listener test publishes to.
platform.placeholder.variables=\
  {\
    "organizationName" : "Egeria openlineage-fvt",\
    "egeriaEndpoint" : "http://localhost:${server.port}",\
    "repositoryDatabaseURL" : "jdbc:postgresql://localhost:5442/egeria",\
    "egeriaServersSecretsStore" : "../../../open-metadata-resources/open-metadata-deployment/secrets/egeria-servers.omsecrets",\
    "repositorySecretCollectionName" : "PostgreSQLRepository",\
    "kafkaEndpoint" : "oak.local:9194"\
  }

startup.user=system
startup.server.list=

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
spring.main.allow-bean-definition-overriding=true
authn.header.name.list=
cors.allowed-origins=*

app.description=openlineage-fvt - Open Lineage connector functional verification tests
app.title=Egeria openlineage-fvt
scan.packages=org.odpi.openmetadata.*
springdoc.api-docs.enabled=false
management.health.cassandra.enabled=false
management.health.redis.enabled=false
management.health.ldap.enabled=false

# ---- openlineage-fvt settings ----

# Where the shared secrets store is, and which collection holds the PostgreSQL repository credentials.
openlineage.fvt.server.secrets.store=../../../open-metadata-resources/open-metadata-deployment/secrets/egeria-servers.omsecrets
openlineage.fvt.server.secrets.collection=PostgreSQLRepository

# The Kafka broker the Kafka listener test publishes to (and the topic it uses).  Must match kafkaEndpoint above.
openlineage.fvt.kafka.endpoint=oak.local:9194
openlineage.fvt.kafka.topic=egeria.openlineage-fvt.events

# How long to wait for the integration daemon to report its group running and the engine host its engines.
openlineage.fvt.governance.server.timeout.seconds=180
openlineage.fvt.governance.server.poll.seconds=2

# How long to wait for an event to be reflected in the repository (the cataloguer works on the daemon's thread as
# the event arrives, so this is normally a few seconds).
openlineage.fvt.event.timeout.seconds=120
openlineage.fvt.event.poll.seconds=2

# How long to wait for a Lovelace analysis service (an engine action) to complete.
openlineage.fvt.engine.action.timeout.seconds=300
openlineage.fvt.engine.action.poll.seconds=2

# Purge the elements left by a previous run before starting.
openlineage.fvt.clear.down=true

logging.level.root=WARN
logging.level.org.springframework=ERROR
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.odpi.openmetadata=WARN
logging.level.org.odpi.openmetadata.platformchassis.springboot=INFO
