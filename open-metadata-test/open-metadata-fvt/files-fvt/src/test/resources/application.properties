# ========================================================================================================
# This is files-fvt's own application.properties, used to configure the in-process OMAG Server Platform
# that OMAGPlatformExtension starts for this suite.  It is deliberately separate from the repo-root
# application.properties so that the port this suite listens on, which PostgreSQL server it uses, and which
# Kafka broker carries the access services' out topics can all be changed here without touching Java code.
#
# This suite runs *four* servers on the one platform - a metadata access store, an integration daemon, an
# engine host and a view server - so that the PostgreSQL connectors can be driven the way they are deployed
# rather than called directly.  A reachable PostgreSQL server is always required; a Kafka broker is required
# only for the default run - see files.fvt.event.bus below.
#
# All paths below are resolved relative to this module's project directory
# (open-metadata-test/open-metadata-fvt/files-fvt), which is Gradle's default working directory for the
# "test" task.

###############################################
### Port for this suite's OMAG Server Platform.
###
### Zero means "any free port": the operating system picks one at start-up and OMAGPlatformExtension reads
### back what it was given, building every client URL from that.  Nothing in this suite depends on a
### particular number, so two runs of this suite - or a run alongside a dev platform, or alongside another
### checkout - cannot collide on a port.  That matters here because this suite is long enough that somebody
### is likely to start other work while it runs.
###
### The port is NOT set here.  OMAGPlatformExtension allocates a free one at run time and passes it in, as
### the sibling suites do.  It cannot be left to server.port=0: the egeriaEndpoint placeholder below is
### resolved into the server's own localServerURL before Tomcat binds, so ${server.port} has to already
### hold a real number by then.  It used to say 9451 while the platform listened somewhere else entirely.
###
### The chosen port is visible in the start-up log if you need to reach the platform from outside the test
### JVM while it is up.
################################################

###############################################
### Set up the name and description for this platform.
################################################
platform.name=files-fvt OMAG Server Platform
platform.description=Hermetic, in-process platform started by the files-fvt functional verification test suite.
platform.organization.name=Egeria files-fvt

###############################################
### Configuration document store - kept under this module's build directory so repeated runs start from a
### clean config each time.  (The PostgreSQL repository content, however, persists across runs - see
### FilesFvtTestSupport for the leftover-element cleanup that handles that.)
################################################
platform.configstore.provider=org.odpi.openmetadata.adapters.adminservices.configurationstore.file.FileBasedServerConfigStoreProvider
platform.configstore.endpoint=build/files-fvt-data/servers/{0}/config/{0}.config

################################################
### Placeholder variables substituted into configuration document field values (syntax: ~{name}~) each time
### a server is (re)started.
###
### "repositoryDatabaseURL" is the JDBC URL (no schema/query-string suffix - the suite appends
### "?currentSchema=..." itself) of the PostgreSQL server that backs the metadata access store's local
### repository.  The default targets the "egeria-shared-postgres" docker container used elsewhere in this
### project for local testing, which already has an "egeria" database and an "egeria_user" role provisioned.
###
### That same server is also the **PostgreSQL server under test**: the suite catalogues and surveys it
### through the connectors.  It is not required to be the same server - see the files.fvt.server.*
### settings below - but making it so by default means one running database is enough to run this suite.
###
### "kafkaEndpoint" is the Apache Kafka broker carrying the access services' out topics.  It is what makes
### the governance servers prompt - the engine host is told about each new engine action as it is requested,
### rather than finding it on its next sweep - but it is not required: see files.fvt.event.bus below.
### Note that it must be the broker's EXTERNAL advertised listener (oak.local:9194), not the internal one
### (egeria-shared-kafka:9192): this suite runs on the host rather than inside the docker network, and a
### client that connects on the internal listener is handed back an address it cannot resolve.
###
### "repositorySecretCollectionName" must name a collection inside "egeriaServersSecretsStore" that supplies
### a userId/clearPassword (or password) able to connect to, and create databases and schemas within, that
### PostgreSQL server.
################################################
platform.placeholder.variables=\
  {\
    "organizationName" : "Egeria files-fvt",\
    "egeriaEndpoint" : "http://localhost:${server.port}",\
    "repositoryDatabaseURL" : "jdbc:postgresql://localhost:5442/egeria",\
    "egeriaServersSecretsStore" : "../../../open-metadata-resources/open-metadata-deployment/secrets/egeria-servers.omsecrets",\
    "repositorySecretCollectionName" : "PostgreSQLRepository",\
    "kafkaEndpoint" : "oak.local:9194"\
  }

################################################
### This suite starts all four of its servers explicitly from Java (see OMAGPlatformExtension), so the
### platform itself should not try to auto-start anything on boot.
################################################
startup.user=system
startup.server.list=

################################################
### Security - this platform has no real user directory configured (it is a hermetic, in-process test
### platform), so FilesFvtSecurityConfig installs a permit-all filter chain.  It also names the anonymous
### principal after this suite's user, so that the view services - which take the caller's userId from the
### security context rather than from the request - act as that user rather than as "anonymousUser".
################################################
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
spring.main.allow-bean-definition-overriding=true
authn.header.name.list=
cors.allowed-origins=*

################################################
# landing page (/api/public/app/info)
################################################
app.description=files-fvt - PostgreSQL connectors functional verification tests
app.title=Egeria files-fvt

################################################
### Which java packages should be scanned to locate the Spring resource definitions that define the REST
### APIs (and, in this suite, the permit-all FilesFvtSecurityConfig bean)?
################################################
scan.packages=org.odpi.openmetadata.*

################################################
### Swagger Docs - not needed for a test suite.
################################################
springdoc.api-docs.enabled=false

################################################
### Spring Boot Actuator health checks - none of these backing services are configured.
################################################
management.health.cassandra.enabled=false
management.health.redis.enabled=false
management.health.ldap.enabled=false

################################################
### Whether this run uses an event bus at all.
###
### "kafka" (the default) configures the access services with out topics on the broker named above, which is
### the normal deployment: the engine host and the integration daemon are told about new engine actions and
### configuration changes as they happen.
###
### "none" configures the access services without out topics and needs no broker.  The governance servers are
### then left with only what they poll for - which is the point: an engine host does not require an event bus,
### it reacts a little later without one.  Every test in this suite is expected to pass either way.
###
### Set from the command line rather than here:
###
###   ./gradlew :open-metadata-test:open-metadata-fvt:files-fvt:test -PrunFilesFvtNoKafka
################################################
files.fvt.event.bus=kafka

################################################
### The directory tree *under test* - the resource the connectors are pointed at.
###
### This suite brings its own files rather than cataloguing whatever happens to be on the machine, for the
### same reason postgres-fvt brings its own database: the assertions can then name exactly what should have
### been catalogued and surveyed.  "The folder survey found 3 files" is an assertion; "the folder survey
### found some files" is not.
###
### The tree is built under this directory at the start of every run, and removed and rebuilt each time, so
### it must be somewhere this JVM may write and somewhere nothing else keeps anything.  It is inside the
### module's build directory by default, which satisfies both and is cleaned by "gradlew clean".
###
### The path is resolved relative to this module's project directory
### (open-metadata-test/open-metadata-fvt/files-fvt), which is Gradle's working directory for the test task.
### An absolute path is used as given - useful for pointing the suite at a tree on another filesystem.
################################################
files.fvt.data.directory=build/files-fvt-data/tree

files.fvt.engine.action.timeout.seconds=300
files.fvt.engine.action.poll.seconds=2

################################################
### How long the suite waits for the integration connector to catalogue what it has been given.
###
### The connector's own refresh interval is 60 seconds, but the suite does not wait for it: it calls the
### integration daemon's refreshConnector API to make the refresh happen now.  This timeout therefore covers
### the connector doing the work, not the wait for its next scheduled run.
################################################
files.fvt.refresh.timeout.seconds=180
files.fvt.refresh.poll.seconds=2

################################################
### How long the suite waits at start-up for the integration daemon's integration group and the engine
### host's governance engines to reach RUNNING.
###
### Both are populated from the metadata access store after the governance server starts, so neither is ready
### the instant its server activates.  A suite that started testing before they were ready would report a
### content pack problem for what is really a timing one.
################################################
files.fvt.governance.server.timeout.seconds=180
files.fvt.governance.server.poll.seconds=2

################################################
### Set to false to keep this run's metadata and its directory tree for inspection afterwards.
###
### By default the suite removes the elements it created, and rebuilds the tree it works on, before it
### starts - not after it finishes.  Clearing up afterwards leaves the debris behind whenever a run is killed
### or crashes, which is exactly when it is most likely to be in a state the next run should not inherit.
###
### With this set to false the tests read a repository holding an earlier run's elements as well as this
### one's, and are likely to report that as a failure - which is the honest outcome, not something to work
### around.
files.fvt.clear.down=true

################################################
### Logging.  Turn these up if you need to see what a connector or a governance service actually did.
################################################
logging.level.root=WARN
logging.level.org.springframework=ERROR
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.odpi.openmetadata=WARN
logging.level.org.odpi.openmetadata.platformchassis.springboot=INFO
# Uncomment to log what the PostgreSQL connectors are doing:
#logging.level.org.odpi.openmetadata.adapters.connectors.postgres=DEBUG
# Uncomment to log every SQL statement the JDBC resource connector issues:
#logging.level.org.odpi.openmetadata.adapters.connectors.resource.jdbc=DEBUG
# Uncomment to log every REST call this suite makes into the platform:
#logging.level.org.odpi.openmetadata.commonservices.ffdc.RESTCallLogger=DEBUG
