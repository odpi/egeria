# ========================================================================================================
# This is platform-catalog-fvt's own application.properties, used to configure the in-process OMAG Server
# Platform that OMAGPlatformExtension starts for this suite.  Everything the suite needs to reach - the
# PostgreSQL server that backs the repository, the Kafka broker that carries the out topics - is named here
# so that it can be pointed somewhere else without touching any Java code.
#
# This file matters more here than in the other FVT suites: the platform these properties configure is the
# resource under test.  platform.name and platform.organization.name below are what the cataloguer reads
# out of the platform's public properties and turns into the platform element's qualified name, resource
# name and display name, so the tests assert against exactly these values.
#
# All paths below are resolved relative to this module's project directory
# (open-metadata-test/open-metadata-fvt/platform-catalog-fvt), which is Gradle's default working directory
# for the "test" task.

###############################################
### The platform's HTTP port is NOT set here.  OMAGPlatformExtension allocates a free port at runtime and
### passes it in, so that two checkouts of Egeria - or two suites - can run their tests at the same time
### without colliding.  Anything below that needs the port refers to it as ${server.port}.
###############################################

###############################################
### Set up the name and description for this platform.
###
### platform.name is deliberately NOT left at the shipped default ("Development OMAG Server Platform"):
### the cataloguer builds the platform element's qualified name out of this name, so a default-named
### platform collides with every other default-named platform in the same ecosystem.  This suite's
### PlatformCatalogMultiplePlatformsFVT tests that collision explicitly, and it can only tell a collision
### apart from a coincidence if this platform's own name is distinctive.
################################################
platform.name=platform-catalog-fvt OMAG Server Platform
platform.description=Hermetic, in-process platform started by the platform-catalog-fvt functional verification test suite.

###############################################
### Set up the name of who is running this platform.
###
### This is the PLATFORM's organization name.  It is a different value from the organization name held in
### each server's configuration document (which the suite sets through the admin client), and the
### cataloguer uses the two in different places: this one qualifies the platform element's names, the
### server one qualifies each server element's names.  Both are covered by
### PlatformCatalogOrganizationNameFVT.
################################################
platform.organization.name=Egeria platform-catalog-fvt

###############################################
### Configuration document store - kept under this module's build directory so repeated runs start from a
### clean config each time.  (The PostgreSQL repository content, however, persists across runs - see
### OMAGPlatformExtension for the leftover cleanup that handles that.)
################################################
platform.configstore.provider=org.odpi.openmetadata.adapters.adminservices.configurationstore.file.FileBasedServerConfigStoreProvider
platform.configstore.endpoint=build/platform-catalog-fvt-data/servers/{0}/config/{0}.config

################################################
### Placeholder variables substituted into configuration document field values (syntax: ~{name}~) each time
### a server is (re)started.
###
### "repositoryDatabaseURL" is the JDBC URL (no schema/query-string suffix - the suite appends
### "?currentSchema=..." itself) of the PostgreSQL server that backs the metadata access store's local
### repository.  The default targets the "egeria-shared-postgres" docker container used elsewhere in this
### project for local testing, which already has an "egeria" database and an "egeria_user" role provisioned.
###
### "kafkaEndpoint" is the Apache Kafka broker carrying the access services' out topics.  This suite needs
### it: the integration daemon learns about its integration group's configuration from the out topics.
### Note that it must be the broker's EXTERNAL advertised listener (oak.local:9194), not the internal one
### (egeria-shared-kafka:9192): this suite runs on the host rather than inside the docker network, and a
### client that connects on the internal listener is handed back an address it cannot resolve.
################################################
platform.placeholder.variables=\
  {\
    "organizationName" : "Egeria platform-catalog-fvt",\
    "egeriaEndpoint" : "http://localhost:${server.port}",\
    "repositoryDatabaseURL" : "jdbc:postgresql://localhost:5442/egeria",\
    "egeriaServersSecretsStore" : "../../../open-metadata-resources/open-metadata-deployment/secrets/egeria-servers.omsecrets",\
    "repositorySecretCollectionName" : "PostgreSQLRepository",\
    "kafkaEndpoint" : "oak.local:9194"\
  }

################################################
### The PostgreSQL schema the metadata access store's repository lives in, and how to reach it to drop that
### schema before each run.
###
### The suite drops and recreates the schema rather than clearing up after itself through the metadata APIs.
### That is not squeamishness about writing a purge: almost nothing this suite asserts on is created by the
### suite - it is all created by the connector, from a platform whose port is allocated afresh every run -
### so the debris has no stable identity to find it by.  Worse, some of it collides: the connector names the
### platform's User Token Manager from a fixed placeholder, so the element one run leaves behind stops the
### next run's connector from starting at all.
###
### These credentials must match the collection named by "repositorySecretCollectionName" in the secrets
### store above, since the same role has to own the schema that the repository connector then writes to.
################################################
platform.catalog.fvt.repository.schema=repository_platformCatalogFvtMetadataStore
platform.catalog.fvt.repository.url=jdbc:postgresql://localhost:5442/egeria
platform.catalog.fvt.repository.user=egeria_user
platform.catalog.fvt.repository.password=user4egeria

################################################
### This suite starts all of its servers explicitly from Java (see OMAGPlatformExtension), so the platform
### itself should not try to auto-start anything on boot.
################################################
startup.user=system
startup.server.list=

################################################
### How long the suite waits for the integration daemon to bring the Egeria integration group up, and how
### long it waits for the cataloguer to register the local platform as its own catalog target.  Raise these
### on a slow machine or a busy Kafka broker.
################################################
platform.catalog.fvt.integration.daemon.timeout.seconds=180
platform.catalog.fvt.integration.daemon.poll.seconds=2

################################################
### Security - this platform has no real user directory configured (it is a hermetic, in-process test
### platform), so Spring Boot's default security auto-configuration is switched off and a permit-all filter
### chain is supplied instead by PlatformCatalogFvtSecurityConfig, which is picked up automatically via
### component scanning (scan.packages, below).  No HTTPS/keystore is configured either - the platform
### listens on plain HTTP.
###
### Note what this costs the suite: with no platform.security.provider set, the platform report carries no
### platform security connection, so the cataloguer skips catalogUsers() entirely.  The UserIdentity and
### Exception handling is therefore NOT covered here - see the README.
################################################
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
authn.header.name.list=
cors.allowed-origins=*

################################################
# landing page (/api/public/app/info)
################################################
app.description=platform-catalog-fvt - OMAG Server Platform Cataloguer functional verification tests
app.title=Egeria platform-catalog-fvt

################################################
### Which java packages should be scanned to locate the Spring resource definitions that define the REST
### APIs (and, in this suite, the permit-all PlatformCatalogFvtSecurityConfig bean)?
################################################
scan.packages=org.odpi.openmetadata.*

################################################
### Swagger Docs - not needed for a test suite.
################################################
springdoc.api-docs.enabled=false

################################################
### Spring Boot Actuator health checks - none of these backing services are configured.
################################################
management.health.cassandra.enabled=false
management.health.redis.enabled=false
management.health.ldap.enabled=false

################################################
### Logging.  Turn these up if you need to see what the cataloguer actually did.
################################################
logging.level.root=WARN
logging.level.org.springframework=ERROR
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.odpi.openmetadata=WARN
logging.level.org.odpi.openmetadata.platformchassis.springboot=INFO
# Uncomment to watch the cataloguer work through the platform:
#logging.level.org.odpi.openmetadata.adapters.connectors.egeriainfrastructure=DEBUG
