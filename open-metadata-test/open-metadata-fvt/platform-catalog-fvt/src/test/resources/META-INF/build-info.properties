#
# Build information for this suite's in-process platform.
#
# A packaged OMAG Server Platform carries this file, written by the Spring Boot build plugin, and Spring
# Boot turns it into the BuildProperties bean that the platform's /api/about endpoint returns.  A platform
# started from a Gradle test worker's classpath has no such file, so there is no bean and the endpoint
# returns nothing.
#
# That is not a detail this suite can shrug off.  The cataloguer asks for the build properties as part of
# building its platform report - the very first thing its refresh does - and it puts the version it gets
# back into the platform element's versionIdentifier.  With no build properties the report fails and the
# refresh ends before anything at all has been catalogued.
#
build.group=org.odpi.egeria
build.artifact=platform-chassis-spring
build.name=platform-catalog-fvt OMAG Server Platform
build.version=6.2-SNAPSHOT
build.time=2026-09-21T00:00:00.000Z
