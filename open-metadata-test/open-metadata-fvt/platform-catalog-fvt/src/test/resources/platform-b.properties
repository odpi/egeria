# ========================================================================================================
# Configuration for the SECOND OMAG Server Platform, the one PlatformCatalogCohortFVT starts in a JVM of
# its own.  The platform keeps its live servers in static registries, so a genuine second platform cannot
# share the first's JVM.
#
# This file replaces application.properties in that JVM rather than adding to it - the platform is started
# with --spring.config.location pointing here - so everything the platform needs is spelled out again.
#
# The one thing to understand about this file is why the platform's name and organization are IDENTICAL to
# the first platform's.  That is the whole point of the test: two platforms that have not been given
# distinguishing names must still be catalogued as two platforms.  Two default installations are exactly
# that case, since platform.name ships as "Development OMAG Server Platform" and platform.organization.name
# ships empty - and a null organization name on both is the same case as an identical one, because the
# names the cataloguer builds no longer depend on either value.

###############################################
### The platform's HTTP port is NOT set here.  PlatformCatalogCohortFVT allocates a free port and passes it
### on the command line, where it overrides anything in this file.
###############################################

###############################################
### Deliberately the same name and organization as the first platform - see above.
################################################
platform.name=platform-catalog-fvt OMAG Server Platform
platform.description=Second hermetic platform started by the platform-catalog-fvt functional verification test suite.
platform.organization.name=Egeria platform-catalog-fvt

###############################################
### Configuration document store - a directory of its own, so that this platform's server configurations
### cannot be confused with the first platform's.
################################################
platform.configstore.provider=org.odpi.openmetadata.adapters.adminservices.configurationstore.file.FileBasedServerConfigStoreProvider
platform.configstore.endpoint=build/platform-catalog-fvt-data/platform-b/servers/{0}/config/{0}.config

################################################
### Placeholder variables.  These match the first platform's except for egeriaEndpoint, which has to be
### this platform's own address.
################################################
platform.placeholder.variables=\
  {\
    "organizationName" : "Egeria platform-catalog-fvt",\
    "egeriaEndpoint" : "http://localhost:${server.port}",\
    "repositoryDatabaseURL" : "jdbc:postgresql://localhost:5442/egeria",\
    "egeriaServersSecretsStore" : "../../../open-metadata-resources/open-metadata-deployment/secrets/egeria-servers.omsecrets",\
    "repositorySecretCollectionName" : "PostgreSQLRepository",\
    "kafkaEndpoint" : "oak.local:9194"\
  }

################################################
### The suite starts this platform's servers explicitly, so it should not auto-start anything on boot.
################################################
startup.user=system
startup.server.list=

################################################
### Security - as hermetic and permit-all as the first platform.  The permit-all filter chain and the two
### endpoints that describe the platform come from the same test classes, which are on this JVM's classpath
### because it is started with the suite's own test runtime classpath.
################################################
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
authn.header.name.list=
cors.allowed-origins=*

################################################
# landing page (/api/public/app/info)
################################################
app.description=platform-catalog-fvt second platform
app.title=Egeria platform-catalog-fvt B

################################################
### Package scanning has to reach this suite's own classes as well as Egeria's, because the permit-all
### security configuration and the /api/about and /api/public/app/info controllers live there.
################################################
scan.packages=org.odpi.openmetadata.*

springdoc.api-docs.enabled=false

management.health.cassandra.enabled=false
management.health.redis.enabled=false
management.health.ldap.enabled=false

################################################
### Logging.  This platform's console output is captured to
### build/platform-catalog-fvt-data/platform-b/platform-b.log rather than mixed into the suite's own.
################################################
logging.level.root=WARN
logging.level.org.springframework=ERROR
logging.level.org.odpi.openmetadata=WARN
logging.level.org.odpi.openmetadata.platformchassis.springboot=INFO
