# The test classes in this suite share one running platform, one integration daemon and one repository, and
# what they assert on is created by the connector rather than laid down per test.  They therefore have to
# run in a known order: the classes that leave the ecosystem as they found it come first, and the ones that
# deliberately disturb it - a second catalog target, a connector restart - come last.  Each class carries an
# @Order.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation

# Within a class, @Order on the test methods is honoured for the same reason: several of them build on the
# state the previous one established.
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$OrderAnnotation
