# ========================================================================================================
# This is cts-fvt's own application.properties, used to configure the in-process OMAG Server Platform that
# OMAGPlatformExtension starts for this harness.  It is deliberately separate from the repo-root
# application.properties so that the port this harness listens on, which PostgreSQL server the technology
# under test stores metadata in, and which Kafka broker carries the cohort, can all be changed here
# without touching any Java code.
#
# This harness runs *two* servers on the one platform - a metadata access store holding the repository
# under test and a conformance test server that drives it - joined by a real cohort.  A reachable Apache
# Kafka broker is always required.  The PostgreSQL settings below apply only to a run started with
# -PrunCtsFvtPostgres; a run started with -PrunCtsFvtInMemory needs no database and ignores them.
#
# All paths below are resolved relative to this module's project directory
# (open-metadata-test/open-metadata-fvt/cts-fvt), which is Gradle's default working directory for the
# "test" task.

###############################################
### Port for this harness's OMAG Server Platform.  Change this if it clashes with something else on your
### machine (e.g. a real dev platform on 7443, or the sibling suites on 9446-9449).
################################################
### The platform's HTTP port is NOT set here.  OMAGPlatformExtension allocates a free port at runtime and
### passes it in, so that two checkouts of Egeria - or two suites - can run their tests at the same time
### without colliding.  A fixed port here used to mean a second checkout running this suite failed with
### PortInUseException.  Anything below that needs the port refers to it as ${server.port}.
###############################################
### Set up the name and description for this platform.
################################################
platform.name=cts-fvt OMAG Server Platform
platform.description=Hermetic, in-process platform started by the cts-fvt conformance suite harness.
platform.organization.name=Egeria cts-fvt

###############################################
### Configuration document store - kept under this module's build directory so repeated runs start from
### a clean config each time.
################################################
platform.configstore.provider=org.odpi.openmetadata.adapters.adminservices.configurationstore.file.FileBasedServerConfigStoreProvider
platform.configstore.endpoint=build/cts-fvt-data/servers/{0}/config/{0}.config

################################################
### Placeholder variables substituted into configuration document field values (syntax: ~{name}~) each
### time a server is (re)started.
###
### "repositoryDatabaseURL" is the JDBC URL (no schema/query-string suffix - the harness appends
### "?currentSchema=..." itself) of the PostgreSQL server backing the technology under test, and is used
### only by a -PrunCtsFvtPostgres run.  The default
### targets the "egeria-shared-postgres" docker container used elsewhere in this project, which already
### has an "egeria" database and an "egeria_user" role provisioned.
###
### "kafkaEndpoint" is the Apache Kafka broker carrying the cohort's registration and instance topics.
### The cohort is not optional here: it is how the conformance suite's repository workbench discovers the
### technology under test and how OMRS events reach it, so a reachable broker is required.  The default
### targets the "egeria-shared-kafka" docker container - note that it must be the broker's EXTERNAL
### advertised listener (oak.local:9194), not the internal one (egeria-shared-kafka:9192): this harness
### runs on the host rather than inside the docker network, and a client that connects on the internal
### listener is handed back an address it cannot resolve.
###
### "repositorySecretCollectionName" must name a collection inside "egeriaServersSecretsStore" that
### supplies a userId/clearPassword (or password) able to connect to, and create schemas/tables within,
### that database.
###
### "ctsFvtSecretsStore" is the secrets store given to the two servers themselves, and is separate from the
### one above: that one holds database credentials, this one holds the servers' own.  It has to be a file
### that exists.  This harness is the only FVT suite where a server's own secrets store is actually read -
### when a server has one, OMRSEnterpriseConnectorManager builds a secrets store connection and embeds it
### in every remote cohort member's connection before a connector is built for it, which is on the path the
### workbench takes to reach the technology under test.  Naming a file that is not there leaves that path
### only half-exercised and logs YAML-SECRETS-STORE-CONNECTOR-0001 once per registration attempt.
################################################
platform.placeholder.variables=\
  {\
    "organizationName" : "Egeria cts-fvt",\
    "egeriaEndpoint" : "http://localhost:${server.port}",\
    "repositoryDatabaseURL" : "jdbc:postgresql://localhost:5442/egeria",\
    "egeriaServersSecretsStore" : "../../../open-metadata-resources/open-metadata-deployment/secrets/egeria-servers.omsecrets",\
    "repositorySecretCollectionName" : "PostgreSQLRepository",\
    "ctsFvtSecretsStore" : "src/test/resources/cts-fvt.omsecrets",\
    "kafkaEndpoint" : "oak.local:9194"\
  }

################################################
### This harness starts both of its servers explicitly from Java (see OMAGPlatformExtension), so the
### platform itself should not try to auto-start anything on boot.
################################################
startup.user=system
startup.server.list=

################################################
### Security - this platform has no real user directory configured (it is a hermetic, in-process test
### platform), so CtsFvtSecurityConfig installs a permit-all filter chain.
################################################
spring.main.allow-bean-definition-overriding=true

################################################
### How long the harness waits for the repository workbench to finish, in seconds, and how often it
### checks.
###
### A full workbench run works through every open metadata type against a real PostgreSQL repository, and it
### is slow: a measured run was still working steadily after 95 minutes, having recorded over 5000 test
### cases, so the limit below is deliberately generous.  The harness prints the number of test cases recorded
### each time it checks, and if it does hit the limit it says whether the workbench was still working or had
### never started - those are different problems and the message distinguishes them.  Raise this rather than
### concluding a long run has hung.
################################################
cts.fvt.workbench.timeout.seconds=21600

################################################
### How long to wait for the workbench's FIRST test case before concluding it never started.
###
### This is deliberately far shorter than the timeout above, because the two situations are different.  A
### workbench that has recorded test cases and run out of time was working and needs longer.  One that has
### recorded none has not started: all that has to happen before the first test case is that the two servers
### find each other in the cohort, and if that has not happened in five minutes it is not going to.  Waiting
### the full budget for it establishes nothing and costs hours.
################################################
cts.fvt.workbench.startup.timeout.seconds=300
cts.fvt.workbench.poll.seconds=60

################################################
### How long a test case waits for an event to reach the other server before deciding it is not coming.
### The wait costs nothing when propagation happens - a loop that gets what it is waiting for leaves
### immediately - so these are set well above what a healthy cohort needs.
###
### Raise them where propagation is genuinely slow: a repository that scans rather than indexes gets slower
### as a run goes on, and on a loaded machine the wait can expire on ordinary delay, which is then reported
### as a conformance failure.  The in-memory repository is the one that shows this.
###
###   -Dcts.fvt.workbench.event.poll.count=600
###
### The defaults are left where the conformance suite sets them.  Raising them by default would turn a
### visible timing sensitivity into an invisible one - a run that waits longer stops reporting the problem
### rather than stopping having it.
################################################
cts.fvt.workbench.event.poll.count=300
cts.fvt.workbench.event.poll.period.ms=100

################################################
### Entity types the repository workbench should test, comma separated.
###
### Only entity types are named here.  The relationship and classification types follow from them, and the
### rule is worth knowing when changing this list:
###
###   * the named types are matched, and so is every supertype of each of them;
###   * a relationship type is tested when BOTH of its ends are in that matched set;
###   * a classification type is tested when ANY of its valid entity types is in it.
###
### The default below is chosen so that between them the types cover every attribute type in the model -
### the primitives, the enumerations, the arrays and the maps - which is what makes a short run still a
### meaningful check of a change rather than a fast one that happens to miss things.  It exercises the
### License and AnnotationMatch relationships, and the Anchors and ZoneMembershipProfile classifications,
### by way of the entity types named here.
###
### Widen it for a fuller check by naming more types:
###
###   -Dcts.fvt.workbench.entity.types=Process,LicenseType,GovernanceZone,ResourceProfileAnnotation,Asset
###
### Set it to empty to test every entity type in the model.  That is what certifying a repository means, and
### it is the only setting that certifies one - but it takes many hours (a measured run against PostgreSQL
### recorded 7923 test cases without a single failure and was still going when it hit
### cts.fvt.workbench.timeout.seconds at six hours), so give it an overnight window and raise the timeout:
###
###   -Dcts.fvt.workbench.entity.types= -Dcts.fvt.workbench.timeout.seconds=86400
###
### Any setting here can be overridden for a single run from the command line, as shown above - Gradle
### forwards -Dcts.fvt.* to the test JVM, and Spring reads system properties ahead of this file.
################################################
cts.fvt.workbench.entity.types=Process,LicenseType,GovernanceZone,ResourceProfileAnnotation

################################################
### Relationship and classification types the repository workbench should test, comma separated.
###
### Left empty, these follow from the entity types above by the rule described there.  That derived set is
### much larger than it looks: the entity types bring their supertypes with them, so Referenceable ends up
### in the run, and with it every relationship whose two ends are both Referenceable.  Naming the types
### wanted here is what keeps a scoped run short.
###
### A type named here still has to have its entity types in the run - naming a relationship whose ends are
### absent does not bring it into the run, because there would be nothing to attach it to.
###
### Set either to empty to test every relationship or classification type the entity types make available.
###
### LabeledRelationship and MoreInformation are here as a supertype/subtype pair.  The relationship subtype
### search test case does nothing at all unless a subtype of the type it is given is itself in the run - it
### returns before its first assertion - so without a pair in this list its nine assertions never execute
### and the run reports nothing about relationship subtype resolution.
################################################
cts.fvt.workbench.relationship.types=License,AnnotationMatch,LabeledRelationship,MoreInformation
cts.fvt.workbench.classification.types=Anchors,ZoneMembershipProfile
