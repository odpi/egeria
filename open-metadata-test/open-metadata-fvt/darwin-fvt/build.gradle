// This module is a Functional Verification Test (FVT) suite for the **Darwin Product Dependency Manager**, the
// nanny integration connector that maintains the coarse-grained lineage implied by the finer-grained lineage
// beneath it: data flows between data assets from the data mappings between their schema elements, data
// flows between software servers from the lineage between the data assets their capabilities own, and
// DigitalProductDependency relationships between digital products from the lineage between their assets.
//
// The fixture - assets, schema attributes, servers, capabilities, products and the lineage between them - is
// loaded as an open metadata archive that the suite builds itself (see DarwinArchiveWriter), so it is
// deterministic and no binary test data needs to be checked in.  Loading it through an archive also means
// every fixture relationship is owned by the archive rather than the repository, which is what exercises
// Darwin's handling of relationships asserted by external users.
//
// The suite stands up the deployment Darwin runs in:
//
//   * a **metadata access store** with a PostgreSQL local repository and its access services publishing to a
//     real Apache Kafka broker - the integration daemon learns about its configuration from the out topics;
//   * an **integration daemon** configured with the DarwinIntegrationGroup from the core content pack, which
//     is where the Darwin Product Dependency Manager runs.
//
// The tests then drive Darwin's refresh explicitly (rather than waiting out its refresh interval) and check
// what arrived in the repository.
//
// Like the other FVTs this is NOT part of the default build.  It only runs when explicitly requested:
//
//   ./gradlew :open-metadata-test:open-metadata-fvt:darwin-fvt:test -PrunDarwinFvt
//
// Database and Kafka connection details and how long the suite is prepared to wait for the integration daemon
// are all controlled from src/test/resources/application.properties.

dependencies {
    // The OMAG Server Platform itself, run in-process via SpringApplication.run(...).
    // user-authn is excluded: it wires in a login/token Spring Security chain that needs a real user
    // directory and credentials, which this hermetic, no-auth platform does not set up.
    testImplementation(project(':open-metadata-implementation:platform-chassis:platform-chassis-spring')) {
        exclude group: 'org.odpi.egeria', module: 'user-authn'
    }

    // Connectors needed to configure and run the two servers.  The Kafka connector is not optional: the
    // integration daemon learns about its configuration from the access services' out topics.
    testRuntimeOnly project(':open-metadata-implementation:adapters:open-connectors:event-bus-connectors:open-metadata-topic-connectors:kafka-open-metadata-topic-connector')
    testRuntimeOnly project(':open-metadata-implementation:adapters:open-connectors:repository-services-connectors:audit-log-connectors:audit-log-console-connector')
    testRuntimeOnly project(':open-metadata-implementation:adapters:open-connectors:repository-services-connectors:open-metadata-collection-store-connectors:postgres-repository-connector')
    testRuntimeOnly project(':open-metadata-implementation:adapters:open-connectors:data-store-connectors:jdbc-resource-connector')
    testRuntimeOnly project(':open-metadata-implementation:adapters:open-connectors:configuration-store-connectors:configuration-file-store-connector')
    testRuntimeOnly project(':open-metadata-implementation:adapters:open-connectors:rest-client-connectors:spring-rest-client-connector')
    testRuntimeOnly project(':open-metadata-implementation:adapters:open-connectors:rest-client-connectors:jdk-rest-client-connector')
    testRuntimeOnly project(':open-metadata-implementation:adapters:open-connectors:secrets-store-connectors:yaml-secrets-store-connector')

    // The connector under test.  This has to be on the test runtime classpath because the integration daemon
    // instantiates it by class name from the connection stored in the repository - a missing one is not a
    // compile failure, it is a connector that will not start.
    testRuntimeOnly project(':open-metadata-implementation:adapters:open-connectors:nanny-connectors')

    // Building the fixture archive.
    testImplementation project(':open-metadata-implementation:repository-services:repository-services-apis')
    testImplementation project(':open-metadata-implementation:repository-services:repository-services-archive-utilities')
    testImplementation project(':open-metadata-resources:open-metadata-archives:open-metadata-types')

    // Clients used to configure, start and drive the two servers
    testImplementation project(':open-metadata-implementation:admin-services:admin-services-api')
    testImplementation project(':open-metadata-implementation:admin-services:admin-services-client')
    testImplementation project(':open-metadata-implementation:platform-services:platform-services-client')
    testImplementation project(':open-metadata-implementation:governance-server-services:integration-daemon-services:integration-daemon-services-api')
    testImplementation project(':open-metadata-implementation:governance-server-services:integration-daemon-services:integration-daemon-services-client')

    // Clients used to read the repository back.
    testImplementation project(':open-metadata-implementation:access-services:omf-metadata-management:omf-metadata-client')
    testImplementation project(':open-metadata-implementation:frameworks:open-metadata-framework')
    testImplementation project(':open-metadata-implementation:frameworks:open-connector-framework')
    testImplementation project(':open-metadata-implementation:frameworks:audit-log-framework')
    // The Darwin connector's own definitions - the integration group, connector name and userId the tests
    // refer to.
    testImplementation project(':open-metadata-resources:open-metadata-archives:core-content-pack')
    testImplementation project(':open-metadata-implementation:adapters:open-connectors')
    testImplementation project(':open-metadata-implementation:adapters:open-connectors:nanny-connectors')

    // In-process Spring Boot startup/shutdown
    testImplementation 'org.springframework.boot:spring-boot'
    testImplementation 'org.springframework:spring-context'
    testImplementation 'org.springframework:spring-web'

    // A permit-all security filter chain is needed so that every request still gets an (anonymous)
    // Authentication in the SecurityContext - the admin/platform REST controllers require one to be
    // present even though this suite's platform has no real user directory configured.
    testImplementation 'org.springframework.security:spring-security-config'
    testImplementation 'org.springframework.security:spring-security-web'

    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'com.fasterxml.jackson.core:jackson-annotations'
}

description = 'Darwin Product Dependency Manager Functional Verification Tests (darwin-fvt)'

// The property is read here, at configuration time, rather than inside the onlyIf closure.  onlyIf is
// evaluated during execution, and reaching for `project` then is unsupported with the configuration
// cache.
def runThisSuite = project.hasProperty('runDarwinFvt')

test {
    useJUnitPlatform()

    // Optional, opt-in suite: needs a reachable PostgreSQL server and Apache Kafka broker, and loads the core
    // content pack, so it is skipped unless explicitly requested with -PrunDarwinFvt.
    onlyIf { runThisSuite }

    // Single JVM fork - the tests share one running platform and two servers (see OMAGPlatformExtension) and
    // are not designed to run concurrently against them.  Several of them also drive Darwin's refresh and then
    // assert on what it did, which only works if nothing else is driving it at the same time.
    maxParallelForks = 1
    testLogging.showStandardStreams = true
}

// Resolves logging conflicts between the various connectors pulled in by the platform chassis
jvmDependencyConflicts {
    logging {
        enforceLogback()
    }
}
