# ========================================================================================================
# view-services-fvt's own application.properties, used to configure the in-process OMAG Server Platform that
# OMAGPlatformExtension starts for this suite.  It follows anchor-fvt's: no HTTPS, a permit-all security filter
# chain (ViewServicesFvtSecurityConfig) and a "repositoryDatabaseURL" for the PostgreSQL variant of the run.
#
# The platform's HTTP port is NOT set here.  OMAGPlatformExtension allocates a free port at runtime and passes
# it in as server.port, which the egeriaEndpoint placeholder below picks up.
# ========================================================================================================

platform.name=view-services-fvt OMAG Server Platform
platform.description=Hermetic, in-process platform started by the view-services-fvt functional verification test suite.
platform.organization.name=Egeria view-services-fvt

platform.configstore.provider=org.odpi.openmetadata.adapters.adminservices.configurationstore.file.FileBasedServerConfigStoreProvider
platform.configstore.endpoint=build/view-services-fvt-data/servers/{0}/config/{0}.config

platform.placeholder.variables=\
  {\
    "organizationName" : "Egeria view-services-fvt",\
    "egeriaEndpoint" : "http://localhost:${server.port}",\
    "repositoryDatabaseURL" : "jdbc:postgresql://localhost:5442/egeria",\
    "egeriaServersSecretsStore" : "../../../open-metadata-resources/open-metadata-deployment/secrets/egeria-servers.omsecrets",\
    "repositorySecretCollectionName" : "PostgreSQLRepository"\
  }

startup.user=system
startup.server.list=

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
authn.header.name.list=
cors.allowed-origins=*

app.description=view-services-fvt - view services functional verification tests
app.title=Egeria view-services-fvt

scan.packages=org.odpi.openmetadata.*

springdoc.api-docs.enabled=false

management.health.cassandra.enabled=false
management.health.ldap.enabled=false

logging.level.root=WARN
logging.level.org.springframework=ERROR
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.odpi.openmetadata=WARN
logging.level.org.odpi.openmetadata.platformchassis.springboot=INFO
# Tests deliberately read deleted elements and send invalid requests - keep the expected FFDC logging quiet.
logging.level.org.odpi.openmetadata.commonservices.ffdc.RESTExceptionHandler=OFF
# Uncomment to log every REST call made into the platform:
#logging.level.org.odpi.openmetadata.commonservices.ffdc.RESTCallLogger=DEBUG
