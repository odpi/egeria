# ========================================================================================================
# bitol-fvt's own application.properties, used to configure the in-process OMAG Server Platform that
# OMAGPlatformExtension starts for this suite.  The suite runs two servers on the one platform - a metadata
# access store with a PostgreSQL repository and Apache Kafka out topics, and an integration daemon running the
# Bitol integration group - so that the Bitol connectors can be driven the way they are deployed rather than
# called directly.  A reachable PostgreSQL server is always required; a Kafka broker is required for the
# default run - see bitol.fvt.event.bus below.
#
# The port is NOT set here: OMAGPlatformExtension allocates a free one at run time and passes it in, so that
# the egeriaEndpoint placeholder below resolves to the port actually in use.
#
# All paths below are resolved relative to this module's project directory
# (open-metadata-test/open-metadata-fvt/bitol-fvt), which is Gradle's default working directory for the
# "test" task.  That is also the directory the Bitol connectors' default endpoints (loading-bay/bitol and
# logs/bitol) resolve against, so the suite finds the file store's output under this module.
# ========================================================================================================

platform.name=bitol-fvt OMAG Server Platform
platform.description=Hermetic, in-process platform started by the bitol-fvt functional verification test suite.
platform.organization.name=Egeria bitol-fvt

###############################################
### Configuration document store - kept under this module's build directory so repeated runs start from a
### clean config each time.  The PostgreSQL repository persists between runs, so OMAGPlatformExtension drops
### this suite's schema before the metadata access store starts.
################################################
platform.configstore.provider=org.odpi.openmetadata.adapters.adminservices.configurationstore.file.FileBasedServerConfigStoreProvider
platform.configstore.endpoint=build/bitol-fvt-data/servers/{0}/config/{0}.config

################################################
### Placeholder variables substituted into configuration document field values (syntax: ~{name}~).
###
### "repositoryDatabaseURL" is the JDBC URL (no schema suffix - the suite appends "?currentSchema=...") of the
### PostgreSQL server that backs the metadata access store's local repository.  The default targets the
### "egeria-shared-postgres" docker container used elsewhere in this project for local testing, which has an
### "egeria" database and an "egeria_user" role provisioned.  The suite's schema (repository_bitolFvtMetadataStore)
### is dropped at the start of every run.
###
### "repositorySecretCollectionName" must name a collection inside "egeriaServersSecretsStore" that supplies a
### userId/clearPassword able to connect to that server and create schemas within it.
###
### "kafkaEndpoint" is the Apache Kafka broker carrying the access services' out topics.  It must be the
### broker's EXTERNAL advertised listener (oak.local:9194), because this suite runs on the host rather than
### inside the docker network.
################################################
platform.placeholder.variables=\
  {\
    "organizationName" : "Egeria bitol-fvt",\
    "egeriaEndpoint" : "http://localhost:${server.port}",\
    "repositoryDatabaseURL" : "jdbc:postgresql://localhost:5442/egeria",\
    "egeriaServersSecretsStore" : "../../../open-metadata-resources/open-metadata-deployment/secrets/egeria-servers.omsecrets",\
    "repositorySecretCollectionName" : "PostgreSQLRepository",\
    "kafkaEndpoint" : "oak.local:9194"\
  }

startup.user=system
startup.server.list=

################################################
### Security - this platform has no real user directory configured, so BitolFvtSecurityConfig installs a
### permit-all filter chain and names the anonymous principal after this suite's user.
################################################
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
spring.main.allow-bean-definition-overriding=true
authn.header.name.list=
cors.allowed-origins=*

app.description=bitol-fvt - Bitol connectors functional verification tests
app.title=Egeria bitol-fvt

scan.packages=org.odpi.openmetadata.*

springdoc.api-docs.enabled=false

management.health.cassandra.enabled=false
management.health.redis.enabled=false
management.health.ldap.enabled=false

################################################
### Which event bus this run uses for the access services' out topics.  "kafka" (the default) publishes to the
### broker named above, which is the normal deployment; "inmemory" uses the in-memory topic connector - both
### servers are in this JVM, so the integration daemon hears the metadata store's events without any broker
### (set from the command line with -PrunBitolFvtInMemory rather than here); "none" configures no out topics
### at all, which stops the publisher connector from starting because it needs to register an event listener.
################################################
bitol.fvt.event.bus=kafka

################################################
### How long the suite waits for the integration daemon to catalog a published document, and for the
### integration group to reach RUNNING at start-up.
################################################
bitol.fvt.refresh.timeout.seconds=120
bitol.fvt.refresh.poll.seconds=2
bitol.fvt.governance.server.timeout.seconds=180
bitol.fvt.governance.server.poll.seconds=2

################################################
### Logging.  Turn these up if you need to see what a connector actually did.
################################################
logging.level.root=WARN
logging.level.org.springframework=ERROR
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.odpi.openmetadata=WARN
logging.level.org.odpi.openmetadata.platformchassis.springboot=INFO
# Uncomment to log every REST call this suite makes into the platform:
#logging.level.org.odpi.openmetadata.commonservices.ffdc.RESTCallLogger=DEBUG
