# ========================================================================================================
# This is duplicate-fvt's own application.properties, used to configure the in-process OMAG Server Platform
# that OMAGPlatformExtension starts for this suite.  Everything the suite needs to reach - the PostgreSQL
# server that backs the repository, the Kafka broker that carries the out topics - is named here so that it
# can be pointed somewhere else without touching any Java code.
#
# All paths below are resolved relative to this module's project directory
# (open-metadata-test/open-metadata-fvt/duplicate-fvt), which is Gradle's default working directory for the
# "test" task.

###############################################
### Port for this suite's OMAG Server Platform.  Change this if it clashes with something else on your
### machine (e.g. a real dev platform on 7443, or the sibling suites on 9446-9451).
################################################
server.port=9452

###############################################
### Set up the name and description for this platform.
################################################
platform.name=duplicate-fvt OMAG Server Platform
platform.description=Hermetic, in-process platform started by the duplicate-fvt functional verification test suite.
platform.organization.name=Egeria duplicate-fvt

###############################################
### Configuration document store - kept under this module's build directory so repeated runs start from a
### clean config each time.  (The PostgreSQL repository content, however, persists across runs - see
### DuplicateFvtTestSupport for the leftover-element cleanup that handles that.)
################################################
platform.configstore.provider=org.odpi.openmetadata.adapters.adminservices.configurationstore.file.FileBasedServerConfigStoreProvider
platform.configstore.endpoint=build/duplicate-fvt-data/servers/{0}/config/{0}.config

################################################
### Placeholder variables substituted into configuration document field values (syntax: ~{name}~) each time
### a server is (re)started.
###
### "repositoryDatabaseURL" is the JDBC URL (no schema/query-string suffix - the suite appends
### "?currentSchema=..." itself) of the PostgreSQL server that backs the metadata access store's local
### repository.  The default targets the "egeria-shared-postgres" docker container used elsewhere in this
### project for local testing, which already has an "egeria" database and an "egeria_user" role provisioned.
###
### "kafkaEndpoint" is the Apache Kafka broker carrying the access services' out topics.  This suite needs
### it: Mendel registers a listener on the OMF out topic after its first refresh, and the event-driven test
### checks that a duplicate link created through the API is acted on without waiting for a refresh.
### Note that it must be the broker's EXTERNAL advertised listener (oak.local:9194), not the internal one
### (egeria-shared-kafka:9192): this suite runs on the host rather than inside the docker network, and a
### client that connects on the internal listener is handed back an address it cannot resolve.
###
### "repositorySecretCollectionName" must name a collection inside "egeriaServersSecretsStore" that supplies
### a userId/clearPassword (or password) able to connect to, and create schemas/tables within, that database.
################################################
platform.placeholder.variables=\
  {\
    "organizationName" : "Egeria duplicate-fvt",\
    "egeriaEndpoint" : "http://localhost:9452",\
    "repositoryDatabaseURL" : "jdbc:postgresql://localhost:5442/egeria",\
    "egeriaServersSecretsStore" : "../../../open-metadata-resources/open-metadata-deployment/secrets/egeria-servers.omsecrets",\
    "repositorySecretCollectionName" : "PostgreSQLRepository",\
    "kafkaEndpoint" : "oak.local:9194"\
  }

################################################
### This suite starts both of its servers explicitly from Java (see OMAGPlatformExtension), so the platform
### itself should not try to auto-start anything on boot.
################################################
startup.user=system
startup.server.list=

################################################
### How long the suite waits for the integration daemon to bring the Mendel integration group up, and for
### Mendel to react to an event.  Raise these on a slow machine or a busy Kafka broker.
################################################
duplicate.fvt.integration.daemon.timeout.seconds=180
duplicate.fvt.integration.daemon.poll.seconds=2
duplicate.fvt.event.timeout.seconds=60
duplicate.fvt.event.poll.seconds=2

################################################
### Security - this platform has no real user directory configured (it is a hermetic, in-process test
### platform), so Spring Boot's default security auto-configuration is switched off and a permit-all filter
### chain is supplied instead by DuplicateFvtSecurityConfig, which is picked up automatically via component
### scanning (scan.packages, below).  No HTTPS/keystore is configured either - the platform listens on plain
### HTTP.
################################################
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
authn.header.name.list=
cors.allowed-origins=*

################################################
# landing page (/api/public/app/info)
################################################
app.description=duplicate-fvt - duplicate management functional verification tests
app.title=Egeria duplicate-fvt

################################################
### Which java packages should be scanned to locate the Spring resource definitions that define the REST
### APIs (and, in this suite, the permit-all DuplicateFvtSecurityConfig bean)?
################################################
scan.packages=org.odpi.openmetadata.*

################################################
### Swagger Docs - not needed for a test suite.
################################################
springdoc.api-docs.enabled=false

################################################
### Spring Boot Actuator health checks - none of these backing services are configured.
################################################
management.health.cassandra.enabled=false
management.health.redis.enabled=false
management.health.ldap.enabled=false

################################################
### Logging.  Turn these up if you need to see what duplicate management actually did.
################################################
logging.level.root=WARN
logging.level.org.springframework=ERROR
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.odpi.openmetadata=WARN
logging.level.org.odpi.openmetadata.platformchassis.springboot=INFO
# Several tests deliberately look up elements that are duplicated, which the generic handler reports as an
# error before it records the duplicates - keep the resulting (expected) FFDC logging out of the build output.
logging.level.org.odpi.openmetadata.commonservices.ffdc.RESTExceptionHandler=OFF
# Uncomment to watch Mendel decide what to do with each duplicate link:
#logging.level.org.odpi.openmetadata.adapters.connectors.mendel=DEBUG
# Uncomment to watch the repository handler combine duplicates on retrieval:
#logging.level.org.odpi.openmetadata.commonservices.repositoryhandler=DEBUG
